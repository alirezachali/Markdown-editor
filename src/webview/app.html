<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --border-color: #3c3c3c;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent: #0078d4;
            --accent-hover: #1084d8;
            --success: #4ec9b0;
            --warning: #dcdcaa;
            --danger: #f48771;
            --sidebar-width: 250px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Title Bar */
        .titlebar {
            height: 30px;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            -webkit-app-region: drag;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-icon {
            font-size: 16px;
            color: var(--accent);
        }

        .app-title {
            font-size: 13px;
            font-weight: 600;
        }

        .file-name {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }

        .titlebar-right {
            display: flex;
            gap: 12px;
            -webkit-app-region: no-drag;
        }

        .titlebar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .titlebar-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Menu Bar */
        .menubar {
            height: 28px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid var(--border-color);
            -webkit-app-region: no-drag;
        }

        .menu-item {
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: var(--bg-tertiary);
        }

        .menu-item i {
            margin-left: 5px;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s;
        }

        .sidebar.collapsed {
            width: 48px;
        }

        .sidebar-header {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .sidebar-actions {
            display: flex;
            gap: 5px;
        }

        .sidebar-btn {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-primary);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .sidebar-btn:hover {
            background: var(--accent);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        .file-item {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background: var(--bg-tertiary);
        }

        .file-item.active {
            background: var(--accent);
            color: white;
        }

        .file-item i {
            font-size: 12px;
            width: 16px;
            text-align: center;
        }

        .file-item.unsaved::after {
            content: '•';
            color: var(--warning);
            font-size: 14px;
        }

        /* Content area */
        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 8px 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pane-actions {
            display: flex;
            gap: 8px;
        }

        /* Editor */
        #editor {
            flex: 1;
            background: var(--bg-primary);
            border: none;
            resize: none;
            outline: none;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow: auto;
        }

        /* Preview */
        #preview {
            flex: 1;
            background: var(--bg-primary);
            padding: 20px 40px;
            overflow-y: auto;
        }

        /* Resizer */
        .resizer {
            width: 4px;
            background: var(--border-color);
            cursor: col-resize;
            transition: background 0.2s;
        }

        .resizer:hover {
            background: var(--accent);
        }

        /* Status bar */
        .statusbar {
            height: 24px;
            background: var(--accent);
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            color: white;
            gap: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        /* Toggle buttons */
        .view-toggle {
            display: none;
            gap: 4px;
        }

        @media (max-width: 768px) {
            .view-toggle {
                display: flex;
            }

            #editor, #preview {
                display: none;
            }

            #editor.mobile-active, #preview.mobile-active {
                display: block;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 5px;
            border: 2px solid var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Title Bar -->
    <div class="titlebar">
        <div class="titlebar-left">
            <i class="fas fa-file-code app-icon"></i>
            <span class="app-title">Markdown Editor</span>
            <span class="file-name" id="file-name">New File.md</span>
        </div>
        <div class="titlebar-right">
            <button class="titlebar-btn" onclick="window.pywebview.api.minimize()" title="Minimize">
                <i class="fas fa-minus"></i>
            </button>
            <button class="titlebar-btn" onclick="window.pywebview.api.maximize()" title="Maximize">
                <i class="fas fa-square"></i>
            </button>
            <button class="titlebar-btn" onclick="window.pywebview.api.close()" title="Close">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Menu Bar -->
    <div class="menubar">
        <div class="menu-item" onclick="app.newFile()">
            <i class="fas fa-file"></i> New
            <span class="shortcut">Ctrl+N</span>
        </div>
        <div class="menu-item" onclick="app.openFile()">
            <i class="fas fa-folder-open"></i> Open
            <span class="shortcut">Ctrl+O</span>
        </div>
        <div class="menu-item" onclick="app.saveFile()">
            <i class="fas fa-save"></i> Save
            <span class="shortcut">Ctrl+S</span>
        </div>
        <div class="menu-item" onclick="app.saveAsFile()">
            <i class="fas fa-save"></i> Save As
            <span class="shortcut">Ctrl+Shift+S</span>
        </div>
        <div class="menu-item" onclick="app.exportHTML()">
            <i class="fas fa-file-export"></i> Export HTML
            <span class="shortcut">Ctrl+E</span>
        </div>
        <div class="menu-item" onclick="app.toggleSidebar()">
            <i class="fas fa-bars"></i> Toggle Sidebar
        </div>
        <div class="menu-item" onclick="app.togglePreview()">
            <i class="fas fa-columns"></i> Split View
        </div>
        <div class="menu-item" onclick="app.toggleTheme()">
            <i class="fas fa-moon"></i> Theme
        </div>
        <div class="menu-item" onclick="app.openSettings()">
            <i class="fas fa-cog"></i> Settings
        </div>
        <div class="menu-item" onclick="window.open('https://github.com/alirezachali/Markdown-editor', '_blank')">
            <i class="fab fa-github"></i> GitHub
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">FILES</span>
                <div class="sidebar-actions">
                    <button class="sidebar-btn" onclick="app.refreshFiles()" title="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="sidebar-btn" onclick="app.showNewFileModal()" title="New File">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
            <div class="file-list" id="file-list">
                <!-- Files will be loaded here -->
                <div class="empty-state">
                    <i class="fas fa-folder"></i>
                    <p>No markdown files found</p>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Editor Pane -->
            <div class="pane" id="editor-pane">
                <div class="pane-header">
                    <span class="pane-title">Edit</span>
                    <div class="pane-actions">
                        <button class="titlebar-btn" onclick="app.splitView()" id="split-btn" title="Split View">
                            <i class="fas fa-columns"></i>
                        </button>
                        <button class="titlebar-btn" onclick="app.showPreviewOnly()" id="preview-only-btn" title="Preview Only">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="titlebar-btn" onclick="app.showEditorOnly()" id="editor-only-btn" title="Editor Only">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>
                </div>
                <textarea id="editor" placeholder="# Start typing your markdown here..."></textarea>
            </div>

            <!-- Resizer -->
            <div class="resizer" id="resizer"></div>

            <!-- Preview Pane -->
            <div class="pane" id="preview-pane">
                <div class="pane-header">
                    <span class="pane-title">Preview</span>
                    <div class="pane-actions">
                        <div class="view-toggle">
                            <button class="titlebar-btn" onclick="app.showEditorOnly()" title="Editor">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="titlebar-btn" onclick="app.showPreviewOnly()" title="Preview">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <button class="titlebar-btn" onclick="app.renderPreview()" title="Render">
                            <i class="fas fa-sync"></i>
                        </button>
                    </div>
                </div>
                <div id="preview">
                    <div class="empty-state">
                        <i class="fas fa-file-alt"></i>
                        <p>Preview will appear here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="statusbar">
        <div class="status-item">
            <i class="fas fa-circle" id="save-status" style="font-size: 8px;"></i>
            <span id="save-text">Ready</span>
        </div>
        <div class="status-item">
            <i class="fas fa-align-left"></i>
            <span id="char-count">0 characters</span>
        </div>
        <div class="status-item">
            <i class="fas fa-paragraph"></i>
            <span id="word-count">0 words</span>
        </div>
        <div class="status-item">
            <i class="fas fa-heading"></i>
            <span id="line-count">0 lines</span>
        </div>
    </div>

    <!-- New File Modal -->
    <div class="modal" id="new-file-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">New File</span>
                <button class="modal-close" onclick="app.closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="text" id="new-file-name" placeholder="filename.md" style="width: 100%; padding: 10px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 4px;" autofocus>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="app.createFile()">Create</button>
            </div>
        </div>
    </div>

    <script>
        // Application state
        const app = {
            editor: null,
            preview: null,
            fileName: null,
            fileContent: '',
            splitMode: false,

            init() {
                this.editor = document.getElementById('editor');
                this.preview = document.getElementById('preview');
                this.setupEventListeners();
                this.updateStats();
                this.loadFiles();
            },

            setupEventListeners() {
                // Editor content changes
                this.editor.addEventListener('input', () => {
                    this.fileContent = this.editor.value;
                    this.updateStats();
                    this.showStatus('Unsaved', 'warning');
                    this.renderPreview();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key.toLowerCase()) {
                            case 's':
                                e.preventDefault();
                                this.saveFile();
                                break;
                            case 'o':
                                e.preventDefault();
                                this.openFile();
                                break;
                            case 'n':
                                e.preventDefault();
                                this.newFile();
                                break;
                            case 'e':
                                e.preventDefault();
                                this.exportHTML();
                                break;
                        }
                    }
                });

                // Resizer
                const resizer = document.getElementById('resizer');
                resizer.addEventListener('mousedown', (e) => this.startResize(e));
            },

            startResize(e) {
                e.preventDefault();
                const sidebar = document.getElementById('sidebar');
                const startX = e.clientX;
                const startWidth = sidebar.offsetWidth;

                const onMouseMove = (ev) => {
                    const newWidth = Math.max(150, Math.min(500, startWidth + ev.clientX - startX));
                    sidebar.style.width = newWidth + 'px';
                };

                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            },

            // File operations
            async loadFiles() {
                const fileList = document.getElementById('file-list');
                try {
                    const files = await pywebview.api.get_markdown_files();
                    this.renderFileList(files);
                } catch (err) {
                    console.error('Error loading files:', err);
                }
            },

            renderFileList(files) {
                const fileList = document.getElementById('file-list');
                if (files.length === 0) {
                    fileList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder"></i>
                            <p>No markdown files found</p>
                        </div>
                    `;
                    return;
                }

                fileList.innerHTML = files.map(file => `
                    <div class="file-item ${file.active ? 'active' : ''}" 
                         onclick="app.selectFile('${file.path}', this)">
                        <i class="fas fa-file-code"></i>
                        <span>${file.name}</span>
                    </div>
                `).join('');
            },

            async selectFile(path, element) {
                // Remove active from all files
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');

                this.showStatus('Loading...', 'info');
                await pywebview.api.load_file(path);
                this.showStatus('Ready', 'success');
            },

            newFile() {
                this.editor.value = '';
                this.fileContent = '';
                this.fileName = 'New File.md';
                document.getElementById('file-name').textContent = this.fileName;
                this.updateStats();
                this.renderPreview();
                this.showStatus('New file - not saved', 'warning');
                document.getElementById('file-list').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder"></i>
                        <p>No markdown files found</p>
                    </div>
                `;
            },

            async openFile() {
                const files = await pywebview.api.get_markdown_files();
                // TODO: Show file picker dialog
                if (files.length > 0) {
                    await this.selectFile(files[0].path, null);
                }
            },

            async saveFile() {
                if (!this.fileName) return;
                try {
                    const success = await pywebview.api.save_file(this.fileName);
                    if (success) {
                        this.showStatus('Saved', 'success');
                        this.updateStats();
                    }
                } catch (err) {
                    console.error('Save error:', err);
                    this.showStatus('Save failed', 'error');
                }
            },

            async saveAsFile() {
                // TODO: Save as dialog
                await this.saveFile();
            },

            async exportHTML() {
                try {
                    const html = await pywebview.api.export_html();
                    const blob = new Blob([html], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = this.fileName.replace('.md', '.html') || 'export.html';
                    a.click();
                    URL.revokeObjectURL(url);
                    this.showStatus('Exported HTML', 'success');
                } catch (err) {
                    console.error('Export error:', err);
                    this.showStatus('Export failed', 'error');
                }
            },

            // Preview
            async renderPreview() {
                try {
                    const html = await pywebview.api.render_preview();
                    this.preview.innerHTML = html;
                } catch (err) {
                    console.error('Preview error:', err);
                }
            },

            // View toggles
            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('collapsed');
            },

            togglePreview() {
                this.splitMode = !this.splitMode;
                this.editor.style.display = this.splitMode ? 'none' : 'block';
                this.preview.style.display = this.splitMode ? 'block' : 'none';
                document.getElementById('split-btn').style.display = this.splitMode ? 'none' : 'inline';
                document.getElementById('preview-only-btn').style.display = this.splitMode ? 'inline' : 'none';
                document.getElementById('editor-only-btn').style.display = 'inline';
            },

            showPreviewOnly() {
                this.editor.style.display = 'none';
                this.preview.style.display = 'block';
                document.getElementById('split-btn').style.display = 'inline';
                document.getElementById('preview-only-btn').style.display = 'none';
                document.getElementById('editor-only-btn').style.display = 'none';
            },

            showEditorOnly() {
                this.editor.style.display = 'block';
                this.preview.style.display = 'none';
                document.getElementById('split-btn').style.display = 'inline';
                document.getElementById('preview-only-btn').style.display = 'inline';
                document.getElementById('editor-only-btn').style.display = 'none';
            },

            splitView() {
                this.editor.style.display = 'none';
                this.preview.style.display = 'block';
                document.getElementById('split-btn').style.display = 'none';
                document.getElementById('preview-only-btn').style.display = 'none';
                document.getElementById('editor-only-btn').style.display = 'none';
            },

            // Theme
            toggleTheme() {
                const html = document.documentElement;
                const isDark = html.classList.toggle('dark');
                pywebview.api.set_theme(isDark ? 'dark' : 'light');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            },

            // Settings
            openSettings() {
                alert('Settings dialog - coming soon!');
            },

            // Modal
            showNewFileModal() {
                document.getElementById('new-file-modal').classList.add('show');
                document.getElementById('new-file-name').focus();
            },

            closeModal() {
                document.getElementById('new-file-modal').classList.remove('show');
                document.getElementById('new-file-name').value = '';
            },

            async createFile() {
                const name = document.getElementById('new-file-name').value.trim();
                if (!name) return;
                if (!name.endsWith('.md')) {
                    document.getElementById('new-file-name').value = name + '.md';
                    return;
                }
                try {
                    await pywebview.api.create_file(name);
                    this.closeModal();
                    this.loadFiles();
                } catch (err) {
                    console.error('Create error:', err);
                }
            },

            // Stats
            updateStats() {
                const text = this.editor.value;
                document.getElementById('char-count').textContent = `${text.length} characters`;
                document.getElementById('word-count').textContent = `${text.trim().split(/\s+/).filter(Boolean).length} words`;
                document.getElementById('line-count').textContent = `${text.split('\n').length} lines`;
            },

            // Status
            showStatus(text, type = 'info') {
                const statusIcon = document.getElementById('save-status');
                const statusText = document.getElementById('save-text');
                statusText.textContent = text;

                const colors = {
                    success: '#4ec9b0',
                    warning: '#dcdcaa',
                    error: '#f48771',
                    info: '#0078d4',
                };

                statusIcon.style.color = colors[type];
            },
        };

        // Initialize app
        app.init();
    </script>
</body>
</html>
